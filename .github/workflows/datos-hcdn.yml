# Actualiza data/comision.json desde los datos abiertos de la HCDN
# (datos.hcdn.gob.ar) y lo commitea si cambió.
name: Datos abiertos HCDN

on:
  schedule:
    # Lunes 12:00 UTC (09:00 de Argentina). Los datasets se actualizan cada pocas semanas.
    - cron: '0 12 * * 1'
  workflow_dispatch: {}       # botón para correrlo a mano desde GitHub

permissions:
  contents: write             # necesario para commitear el JSON

jobs:
  datos-hcdn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run sync:hcdn
        env:
          NODE_EXTRA_CA_CERTS: certs/SectigoPublicServerAuthenticationCADVR36.pem
      - name: Commitear datos si cambiaron
        run: |
          git config user.name "seguimiento-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/comision.json
          git diff --staged --quiet || git commit -m "Actualiza datos de la comisión desde datos.hcdn.gob.ar [skip ci]"
          git push
