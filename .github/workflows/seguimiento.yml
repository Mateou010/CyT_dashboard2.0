# Corre el seguimiento y commitea el estado actualizado al repo.
name: Seguimiento de proyectos de ley

on:
  schedule:
    # Cada 2 horas de 10 a 18 hs de Argentina (UTC-3), solo Lun-Vie.
    # 10:17,12:17,14:17,16:17,18:17 ART = 13:17,15:17,17:17,19:17,21:17 UTC.
    # Evitamos el minuto 0 porque GitHub Actions suele demorar/cancelar schedules en hora pico.
    - cron: '17 13,15,17,19,21 * * 1-5'
  workflow_dispatch: {}       # botón para correrlo a mano desde GitHub

permissions:
  contents: write             # necesario para commitear el estado

jobs:
  seguimiento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node run.js --recientes=7
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SUBSCRIBE_SECRET: ${{ secrets.SUBSCRIBE_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_EXTRA_CA_CERTS: certs/SectigoPublicServerAuthenticationCADVR36.pem
      # Agenda de reuniones (data/agenda.json). Los avisos de citación solo se
      # envían si la variable del repo ALERTAS_CITACIONES vale '1'; si no, se loguean.
      - name: Agenda de la comisión y avisos de citación
        run: node scripts/sync-agenda.mjs --alertar
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SUBSCRIBE_SECRET: ${{ secrets.SUBSCRIBE_SECRET }}
          ALERTAS_CITACIONES: ${{ vars.ALERTAS_CITACIONES }}
          NODE_EXTRA_CA_CERTS: certs/SectigoPublicServerAuthenticationCADVR36.pem
      - name: Commitear estado si cambió
        run: |
          git config user.name "seguimiento-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data/proyectos-seguimiento.json data/agenda.json data/citaciones-enviadas.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || git commit -m "Actualiza estado de seguimiento [skip ci]"
          git push
